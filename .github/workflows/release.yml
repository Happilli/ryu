name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - run: pacman -Syu --noconfirm base-devel git cmake ninja qt6-base qt6-declarative qt6-tools qt6-shadertools pipewire
      - uses: actions/checkout@v5
      - name: Build
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr -G Ninja
          ninja -C build
          DESTDIR="$PWD/staging" ninja -C build install
          VER="${GITHUB_REF_NAME#v}"
          tar czf "ryu-$VER-x86_64.tar.gz" -C staging usr
          sha256sum "ryu-$VER-x86_64.tar.gz" > "ryu-$VER-x86_64.tar.gz.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            ryu-*-x86_64.tar.gz
            ryu-*-x86_64.tar.gz.sha256
